# TODO: Verify LiDAR mounting, scan registration and limits in MORAI blackout.
lidar_to_rear_x_m: 1.4
min_z_m: -0.8
max_z_m: 0.8
max_range_m: 18.0
voxel_m: 0.25
max_pair_distance_m: 0.65
min_pairs: 35
max_rmse_m: 0.25
max_correction_m: 0.5
max_correction_rad: 0.12
icp_forward_weight: 0.0  # tunnel wall ICP has weak forward observability; use Ego speed/heading distance
icp_lateral_weight: 0.10
input_timeout_s: 0.6
# A missing /gps stream triggers blackout after this delay, following a GPS anchor.
gps_silence_timeout_s: 0.75
gps_return_grace_s: 1.5
gps_pose_max_age_s: 1.0
# The GPS Denied Area covers approximately waypoints 3803-4050; allow a
# margin for simulator sensor boundaries and rejoin near waypoint 4081.
blackout_start_index: 3780
blackout_end_index: 4100
sim_exit_x_m: -78.35
sim_exit_y_m: -545.63
sim_exit_waypoint_index: 4053
exit_rejoin_start_m: 15.0  # physical distance to the photographed exit gate
exit_rejoin_full_m: 0.0  # keep measured wall guidance until the actual exit
exit_anchor_speed_cap_mps: 5.0  # 18 km/h during simulator-confirmed exit re-anchoring
exit_anchor_start_m: 35.0  # begin correcting forward drift before the final exit turn
exit_anchor_step_m: 1.0  # maximum map-pose correction per valid LiDAR scan
sim_exit_trigger_radius_m: 15.0
sim_exit_cross_track_limit_m: 2.0
max_blackout_distance_m: 160.0  # TODO: validate ICP drift over the 122 m tunnel in MORAI
max_unmatched_distance_m: 3.0
max_rejoin_error_m: 2.0
max_rejoin_yaw_rad: 0.25
