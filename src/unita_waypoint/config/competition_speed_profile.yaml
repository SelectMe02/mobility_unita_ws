# Target speed = Map Tuner project point speed_kmh
# (map_tunner_project.json). No route speed cap is configured here.

# Curvature is published for debugging only; it does not lower speed.
curvature_window_m: 10.0
# Acceleration/braking envelope joining adjacent project point speeds.
max_profile_accel_mps2: 2.0
max_profile_decel_mps2: 3.5

# Speed-proportional Pure Pursuit look-ahead: Ld = gain * speed(m/s).
min_lookahead_distance: 5.0
max_lookahead_distance: 30.0
lookahead_speed_gain: 0.78

# Gains act on km/h error and produce normalized MORAI accel/brake (0..1).
pid_kp: 0.08
pid_ki: 0.002
pid_kd: 0.01
pid_integral_limit: 20.0
speed_feedback_timeout: 0.5

# Soft brake limit for avoidance deceleration; a full stop is never limited.
avoidance_brake_limit: 0.35
avoidance_clear_hold_s: 0.4
restart_accel_rate_per_s: 0.5
